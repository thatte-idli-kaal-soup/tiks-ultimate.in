{{ define "main" }}
  <main class="content page-template page-archive">
    <article class="post page">
      <header class="post-header">
        <a id="back-to-main-page" href="{{ "/" | relLangURL }}"><i class="fa fa-chevron-left" aria-hidden="true"></i> {{ .Site.Title }}</a>
      </header>
      <h1 class="post-title">{{ .Title }}</h1>
      <section class="post-content">
        <ul>
          {{ range .Pages.ByDate.Reverse }}
          <li>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            {{ with .Date }}<span class="post-date"> — {{ .Format "January 2, 2006" }}</span>{{ end }}
            {{ with .Params.author }}<span class="author"> by {{ . }}</span>{{ end }}
          </li>
          {{ end }}
        </ul>
      </section>
    </article>
  </main>
{{ end }}
